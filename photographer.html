<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" 
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" 
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">
    <title>Fisheye - photographe </title>
  </head>
  <body>

    <header>
      <!-- Logo -->
      <a href="index.html"><img src="assets/images/logo.png" class="logo" /></a>
      <!-- /Logo -->
    </header>

    <main id="main">

      <!-- Photographer header -->
      <div class="photograph-header">
        <div>
          <h2 class="name"></h2>
          <p class="location"></p>
          <p class="tagline"></p>  
        </div>
        <div>
          <button class="contact_button headerBtn" onclick="displayModal()">Contactez-moi</button>
        </div>        
        <div class="frame">
          <!-- ... -->
        </div>
      </div>
      <!-- /Photographer header -->

      <div class="photograph-main">

        <div class="photograph-sort">
          <label>Trier par</label>          
          <div class="sort_container">            
            <select >
              <option value="0">Titre</option>
              <option value="1">Popularité</option>
            </select>
          </div>
        </div>
        <div id="grid">
          <!-- ... -->
        </div>
        <div class="counter">
          <p class="likes_counter"></p>
          <p class="cost"></p>
        </div>
      </div>
    </main>

    <div id="lightbox_modal">
      <div id="lightbox">
        <div class="lightbox-content">
          <img id="lightboxImage" src="">
          <video id="lightboxVideo" src="" controls></video>
        </div>
        <div id="caption"></div>
        <button id="lightbox-close"></button>
        <button id="lightbox-prev"></button>
        <button id="lightbox-next"></button>
      </div>
    </div>

    <div id="contact_modal">
			<div class="modal">
				<header>
          <h2 class="modal_title"></h2>
          <img src="assets/icons/close.svg" onclick="closeModal()" />
        </header>
				<form>
					<div>
						<label>Prénom</label>
						<input />
            <label>Nom</label>
						<input />
            <label>Email</label>
						<input />
            <label>Votre message</label>
						<input type="text" name="message" id="message">
					</div>
          <button class="contact_button">Envoyer</button>
				</form>
			</div>
		</div>

    <!-- Factories -->
    <script src="scripts/factories/factory.js"></script>

    <!-- Models -->
    <script src="scripts/models/artist.js"></script>
    <script src="scripts/models/media.js"></script>

    <!-- Templates -->
    <script src="scripts/templates/header.js"></script>
    <script src="scripts/templates/mediaCard.js"></script>    

    <!-- Utils -->
    <script src="/scripts/utils/filters.js"></script>
    <script src="scripts/utils/data.js"></script>
    <script src="/scripts/utils/lightbox.js"></script>
    <script src="/scripts/utils/contactForm.js"></script>
    <script src="/scripts/utils/counter.js"></script>
    <script src="/scripts/utils/dropdown.js"></script>

    <!-- Pages -->
    <script src="/scripts/pages/photographer.js"></script>
  </body>
</html>
